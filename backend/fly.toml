# fly.toml — Fly.io deployment configuration
# Run: fly launch (first time) or fly deploy

app = "routine-recovery-api"
primary_region = "iad"

[build]

[env]
  APP_ENV = "production"
  API_V1_PREFIX = "/api/v1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
